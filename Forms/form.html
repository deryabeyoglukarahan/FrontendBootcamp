<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Formu</title>

    <style>
        /* Sayfa genel stilleri */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f8b195, #f67280, #c06c84);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Form kutusu */
        form {
            background-color: #fff;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.2);
            width: 350px;
        }

        /* Başlık */
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        /* Etiketler */
        label {
            font-weight: 600;
            display: block;
            margin-top: 7px;
            color: #444;
        }

        /* Giriş alanları */
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #f67280;
            outline: none;
            box-shadow: 0 0 5px rgba(246, 114, 128, 0.5);
        }

        /* Cinsiyet alanı */
        .gender-group {
            margin-top: 15px;
        }

        .gender-group p {
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
        }

        .gender-options {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .gender-options label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        /* Gönder butonu */
        input[type="submit"] {
            width: 100%;
            background-color: #f67280;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #c06c84;
        }
    </style>
</head>

<body>
    <form action="#" method="get">
        <h2>Kayıt Formu</h2>

        <label for="fname">Ad:</label>
        <input type="text" id="fname" name="fname" required>

        <label for="lname">Soyad:</label>
        <input type="text" id="lname" name="lname" required>

        <label for="email">E-posta:</label>
        <input type="email" id="email" name="email" required>

        <label for="pwd">Şifre:</label>
        <input type="password" id="pwd" name="pwd" minlength="8" required>

        <div class="gender-group">
            <p>Cinsiyet:</p>
            <div class="gender-options">
                <label for="male">
                    <input type="radio" id="male" name="gender" value="male" required> Erkek
                </label>
                <label for="female">
                    <input type="radio" id="female" name="gender" value="female" required> Kadın
                </label>
            </div>
        </div>

        <label for="fruit">Favori Meyve:</label>
        <select id="fruit" name="fruit">
            <option value="apple">Elma</option>
            <option value="banana">Muz</option>
            <option value="strawberry">Çilek</option>
        </select>

        <label for="message">Mesaj:</label>
        <textarea id="message" name="message" rows="2"></textarea>

        <input type="submit" value="Gönder">
    </form>
</body>

</html>
